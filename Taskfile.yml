# https://taskfile.dev
version: "3"

tasks:
  default:
    deps: [build]

  _build:
    desc: "Build the sesam binary"
    vars:
      VERSION:
        sh: git describe --tags --always
    cmds:
      - cmd: CGO_ENABLED=0 GOARCH={{.GOARCH}} GOOS={{.GOOS}} go build -ldflags "-s -w -X opensesam.org/sesam/cli.version={{.VERSION}}" -o sesam .
    sources:
      - ./*.go
      - ./**/*.go
      - Taskfile.yml
      # go:embed'ed assets — they change the binary without any .go file changing.
      - config/sesam_schema.json
      - cli/manual/sesam.1
      - cli/manual/manual.md
      - repo/assets/*.default
    generates:
      - ./sesam
    method: checksum

  build-arm64:
    cmds:
      - task: _build
        vars:
          GOOS: linux
          GOARCH: arm64

  build-amd64:
    cmds:
      - task: _build
        vars:
          GOOS: linux
          GOARCH: amd64

  build:
    aliases:
      - build
    cmds:
      - task: _build
        # empty, so go chooses itself.
        vars:
          GOOS: ""
          GOARCH: ""

  test:
    desc: Run go tests
    cmds:
      - gotestsum --format testname -- -tags docgen ./...

  test-race:
    desc: Run go tests
    cmds:
      - gotestsum --format testname -- -tags docgen -race  ./...

  coverage:
    desc: Run go tests with coverage report
    cmds:
      - go test -tags docgen -coverpkg=./... -coverprofile=coverage.out ./...
      - go tool cover -func=coverage.out
      - go tool cover -html=coverage.out

  lint:
    desc: Run the linter
    cmds:
      - pkill -9 -f golangci || true
      - golangci-lint run -c linter.yml

  fmt:
    desc: Format all Go sources via gofumpt
    cmds:
      - gofumpt -w -extra .

  docgen:
    desc: Generate all reference docs (CLI + config + manual)
    # Serialized on purpose: all three exec the same freshly built binary, and
    # running them in parallel races the build into "text file busy".
    cmds:
      - task: docgen:cli
      - task: docgen:cfg
      - task: docgen:man

  docgen:build:
    desc: Build the doc generator, which carries cli-docs and go-md2man
    cmds:
      - go build -tags docgen -o sesam-docgen .
    sources:
      - ./*.go
      - ./**/*.go
      - config/sesam_schema.json
      - cli/docgen/config_template.md
      - docs/src/*.md
    generates:
      - ./sesam-docgen
    method: checksum

  docgen:cli:
    desc: Generate CLI reference markdown from live command tree
    deps: [docgen:build]
    cmds:
      - ./sesam-docgen docgen cli > docs/src/cli_ref.md
    sources:
      - ./sesam-docgen
    generates:
      - docs/src/cli_ref.md

  docgen:cfg:
    desc: Generate config reference markdown from sesam_schema.json
    deps: [docgen:build]
    cmds:
      - ./sesam-docgen docgen config > docs/src/config_ref.md
    sources:
      - ./sesam-docgen
      - config/sesam_schema.json
      - cli/docgen/config_template.md
    generates:
      - docs/src/config_ref.md

  docgen:man:
    desc: Generate the manual the binary embeds, as roff and as markdown
    deps: [docgen:build]
    cmds:
      - ./sesam-docgen docgen man --format=roff > cli/manual/sesam.1
      - ./sesam-docgen docgen man --format=markdown > cli/manual/manual.md
    sources:
      - ./sesam-docgen
      - docs/src/*.md
    generates:
      - cli/manual/sesam.1
      - cli/manual/manual.md

  docgen:check:
    desc: Fail if the committed generated docs are stale (for CI)
    deps: [docgen]
    cmds:
      - git diff --exit-code -- cli/manual/ docs/src/cli_ref.md docs/src/config_ref.md

  vuln:
    desc: Scan dependencies and stdlib usage for known vulnerabilities (govulncheck)
    cmds:
      - go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 -show verbose ./...

  docs:
    desc: Builds docs
    deps: [docgen]
    cmds:
      - cd docs && mdbook serve --open

  changelog:
    desc: Regenerate CHANGELOG.md from conventional-commit history
    cmds:
      - git-cliff -o CHANGELOG.md

  unreleased:
    desc: Preview the unreleased changelog section without writing the file
    cmds:
      - git-cliff --unreleased

  release:
    desc: "Tag, build, sign and publish a release locally (task release -- vX.Y.Z)"
    cmds:
      - scripts/release.sh {{.CLI_ARGS}}
