name: CI

on:
  push:
    branches: ["main"]
  pull_request:

# Workflow-level: at job level, the matrix jobs would share one group and cancel each other.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        task: [lint, test-race, vuln]

    name: ${{ matrix.task }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
          # The first job to finish saves the cache; keep it the one with -race artifacts.
          cache: ${{ matrix.task == 'test-race' }}

      - name: Set up tools
        uses: jdx/mise-action@v4

      - name: Run ${{ matrix.task }}
        run: task ${{ matrix.task }}
